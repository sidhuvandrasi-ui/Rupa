  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080711;
      --purple: #8b5cf6;
      --pink: #d946ef;
      --text: #ffffff;
      --muted: #aaa7bd;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 15%, rgba(139,92,246,.19), transparent 38%),
        radial-gradient(ellipse at 85% 85%, rgba(217,70,239,.13), transparent 38%),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .15;
      background-image:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .glow {
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .25;
      pointer-events: none;
    }

    .glow-one {
      top: -100px;
      left: -80px;
      background: var(--purple);
    }

    .glow-two {
      right: -100px;
      bottom: -100px;
      background: var(--pink);
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 440px;
      text-align: center;
      animation: fadeUp .9s ease both;
    }

    .top-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 15px;
      margin-bottom: 30px;
      border: 1px solid rgba(167,139,250,.25);
      border-radius: 50px;
      background: rgba(139,92,246,.09);
      color: #d8c8ff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 10px #a78bfa;
      animation: pulse 1.8s infinite;
    }

    .logo-wrap {
      position: relative;
      width: 154px;
      height: 154px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(167,139,250,.7);
      box-shadow:
        0 0 24px rgba(139,92,246,.2),
        inset 0 0 20px rgba(139,92,246,.08);
      animation: rotate 12s linear infinite;
    }

    .logo-ring::before,
    .logo-ring::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d8b4fe;
      box-shadow: 0 0 14px #a78bfa;
    }

    .logo-ring::before {
      top: 18px;
      left: 22px;
    }

    .logo-ring::after {
      right: 13px;
      bottom: 32px;
    }

    .logo {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.13);
      box-shadow: 0 0 35px rgba(139,92,246,.3);
      background: #171326;
    }

    h1 {
      font-size: clamp(32px, 9vw, 43px);
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1.15;
      background: linear-gradient(110deg, #ffffff 15%, #c4b5fd 55%, #e879f9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 35px rgba(167,139,250,.08);
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .divider {
      width: 64px;
      height: 3px;
      margin: 24px auto;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      box-shadow: 0 0 15px rgba(168,85,247,.45);
    }

    .community-card {
      padding: 24px 20px;
      margin-top: 25px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 22px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.065),
        rgba(255,255,255,.018)
      );
      box-shadow: 0 18px 55px rgba(0,0,0,.25);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card-heading {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .card-description {
      max-width: 310px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .telegram-button {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      width: 100%;
      min-height: 58px;
      margin-top: 24px;
      padding: 16px 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(110deg, #7650e8, #a855f7 55%, #d946ef);
      box-shadow: 0 10px 30px rgba(139,92,246,.25);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-decoration: none;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .telegram-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.22),
        transparent
      );
      transform: skewX(-20deg);
      animation: shine 4s ease-in-out infinite;
    }

    .telegram-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 38px rgba(139,92,246,.4);
    }

    .telegram-button:active {
      transform: scale(.98);
    }

    .telegram-icon {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .secure-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 17px;
      color: #88839d;
      font-size: 10px;
      letter-spacing: .5px;
    }

    .secure-note svg {
      width: 13px;
      height: 13px;
      fill: #a78bfa;
    }

    footer {
      margin-top: 30px;
      color: #69647c;
      font-size: 10px;
      letter-spacing: 1px;
    }

    footer span {
      color: #a78bfa;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.8); }
    }

    @keyframes shine {
      0%, 65% { left: -120%; }
      100% { left: 150%; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 380px) {
      .logo-wrap {
        width: 136px;
        height: 136px;
      }

      .logo {
        width: 114px;
        height: 114px;
      }

      .community-card {
        padding: 21px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    <footer>

  </main>

</body>
